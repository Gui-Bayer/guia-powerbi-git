    <rect x="498" y="76" width="308" height="350" rx="8" fill="#ffffff" stroke="#c8c6c4"/>
    <rect x="498" y="76" width="308" height="34" rx="8" fill="#f3f2f1"/>
    <rect x="498" y="100" width="308" height="10" fill="#f3f2f1"/>
    <text x="516" y="98" font-size="12" font-weight="600" fill="#201f1e">Salvar como</text>
    <text x="790" y="98" text-anchor="end" font-size="12" fill="#605e5c">&#10005;</text>

    <text x="516" y="136" font-size="11" fill="#605e5c">Nome do arquivo</text>
    <rect x="516" y="144" width="272" height="28" rx="3" fill="#ffffff" stroke="#8a8886"/>
    <text x="528" y="163" font-size="11.5" fill="#201f1e">Vendas LATAM</text>

    <text x="516" y="196" font-size="11" fill="#605e5c">Tipo</text>
    <rect x="516" y="204" width="272" height="30" rx="3" fill="#ffffff" stroke="#0f6cbd" stroke-width="2"/>
    <text x="528" y="224" font-size="11.5" font-weight="600" fill="#0f6cbd">Power BI project files (*.pbip)</text>
    <text x="772" y="224" font-size="10" fill="#0f6cbd">&#9662;</text>

    <rect x="516" y="244" width="272" height="30" rx="3" fill="#f3f2f1" stroke="#e1dfdd"/>
    <text x="528" y="263" font-size="11.5" fill="#a19f9d">Power BI files (*.pbix)</text>

    <rect x="516" y="290" width="272" height="72" rx="6" fill="#eff6fc" stroke="#0f6cbd"/>
    <text x="530" y="312" font-size="11" font-weight="600" fill="#0f6cbd">Por que .pbip?</text>
    <text x="530" y="330" font-size="10.5" fill="#1b3f66">Gera uma pasta com arquivos de texto</text>
    <text x="530" y="346" font-size="10.5" fill="#1b3f66">(JSON e TMDL) que o Git consegue versionar.</text>

    <rect x="632" y="382" width="74" height="28" rx="3" fill="#0f6cbd"/>
    <text x="669" y="401" text-anchor="middle" font-size="11.5" font-weight="600" fill="#ffffff">Salvar</text>
    <rect x="714" y="382" width="74" height="28" rx="3" fill="#ffffff" stroke="#8a8886"/>
    <text x="751" y="401" text-anchor="middle" font-size="11.5" fill="#201f1e">Cancelar</text>

    <text x="516" y="392" font-size="10" fill="#605e5c">Preview ativado em</text>
    <text x="516" y="406" font-size="10" fill="#605e5c">Opções &#8594; Recursos</text>
    <text x="516" y="420" font-size="10" fill="#605e5c">de Preview</text>
