<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" role="img" aria-label="Diferença entre PBIX e PBIP">
  <rect width="880" height="400" rx="14" fill="#f8fafc"/>
  <g font-family="Segoe UI, Inter, sans-serif">
    <rect x="20" y="20" width="400" height="360" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="20" y="20" width="400" height="46" rx="12" fill="#fef3c7"/>
    <rect x="20" y="54" width="400" height="12" fill="#fef3c7"/>
    <text x="44" y="50" font-size="16" font-weight="700" fill="#92400e">.PBIX &#8212; arquivo binário único</text>

    <g transform="translate(140 96)">
      <rect x="0" y="0" width="120" height="140" rx="10" fill="#F2C811"/>
      <rect x="14" y="18" width="92" height="12" rx="4" fill="#fff" opacity=".85"/>
      <rect x="14" y="40" width="72" height="12" rx="4" fill="#fff" opacity=".6"/>
      <rect x="14" y="62" width="92" height="12" rx="4" fill="#fff" opacity=".6"/>
      <text x="60" y="108" text-anchor="middle" font-size="15" font-weight="700" fill="#5b4200">PBIX</text>
      <text x="60" y="128" text-anchor="middle" font-size="11" fill="#5b4200">binário</text>
    </g>

    <g font-size="12.5" fill="#475569">
      <text x="44" y="266">&#8226; Relatório + modelo compactados em 1 arquivo</text>
      <text x="44" y="290">&#8226; Git vê apenas "o arquivo mudou"</text>
      <text x="44" y="314">&#8226; Não é possível comparar (diff) medidas DAX</text>
      <text x="44" y="338">&#8226; Conflitos não podem ser mesclados</text>
      <text x="44" y="362">&#8226; Ideal para: uso individual / distribuição</text>
    </g>

    <rect x="460" y="20" width="400" height="360" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="460" y="20" width="400" height="46" rx="12" fill="#dbeafe"/>
    <rect x="460" y="54" width="400" height="12" fill="#dbeafe"/>
    <text x="484" y="50" font-size="16" font-weight="700" fill="#1e40af">.PBIP &#8212; pasta com arquivos de texto</text>

    <g transform="translate(484 84)" font-size="12" fill="#334155">
      <rect x="0" y="0" width="352" height="160" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
      <text x="14" y="24" font-family="Consolas, monospace" fill="#0f172a">Vendas.pbip</text>
      <text x="14" y="46" font-family="Consolas, monospace" fill="#1e40af">Vendas.Report/</text>
      <text x="34" y="66" font-family="Consolas, monospace">definition/pages/pages.json</text>
      <text x="34" y="86" font-family="Consolas, monospace">definition/report.json</text>
      <text x="14" y="108" font-family="Consolas, monospace" fill="#1e40af">Vendas.SemanticModel/</text>
      <text x="34" y="128" font-family="Consolas, monospace">definition/tables/Vendas.tmdl</text>
      <text x="34" y="148" font-family="Consolas, monospace">definition/model.tmdl</text>
    </g>

    <g font-size="12.5" fill="#475569">
      <text x="484" y="266">&#8226; Relatório e modelo em JSON / TMDL legível</text>
      <text x="484" y="290">&#8226; Git mostra linha a linha o que mudou</text>
      <text x="484" y="314">&#8226; Diff e revisão de medidas DAX no Pull Request</text>
      <text x="484" y="338">&#8226; Conflitos podem ser resolvidos manualmente</text>
      <text x="484" y="362">&#8226; Ideal para: equipe, versionamento e CI/CD</text>
    </g>
  </g>
</svg>
