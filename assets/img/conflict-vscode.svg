      <text x="20" y="230" fill="#858585">22</text><text x="76" y="230" fill="#569cd6">measure</text><text x="140" y="230" fill="#ce9178"> 'KPI LATAM'</text><text x="240" y="230" fill="#d4d4d4"> =</text>
      <text x="20" y="252" fill="#858585">23</text><text x="100" y="252" fill="#dcdcaa">DIVIDE</text><text x="152" y="252" fill="#d4d4d4">( [Receita], [Meta] )</text>
      <text x="20" y="274" fill="#858585">24</text><text x="100" y="274" fill="#4ec9b0">formatString</text><text x="204" y="274" fill="#ce9178">: 0.0%</text>

