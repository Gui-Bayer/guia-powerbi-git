<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" role="img" aria-label="Power BI Desktop com a opção de salvar como projeto PBIP">
  <rect width="820" height="440" rx="12" fill="#f3f2f1"/>
  <rect x="0" y="0" width="820" height="34" rx="12" fill="#F2C811"/>
  <rect x="0" y="22" width="820" height="12" fill="#F2C811"/>
  <g font-family="Segoe UI, Inter, sans-serif">
    <g transform="translate(14 8)">
      <rect x="0" y="9" width="4" height="9" rx="1" fill="#5b4200"/>
      <rect x="6" y="5" width="4" height="13" rx="1" fill="#5b4200"/>
      <rect x="12" y="1" width="4" height="17" rx="1" fill="#5b4200"/>
    </g>
    <text x="42" y="22" font-size="12" font-weight="600" fill="#3b2c00">Vendas LATAM &#8212; Power BI Desktop</text>
    <text x="806" y="22" text-anchor="end" font-size="12" fill="#3b2c00">&#8211; &#9633; &#10005;</text>

    <rect x="0" y="34" width="820" height="30" fill="#ffffff"/>
    <g font-size="11.5" fill="#323130">
      <text x="18" y="54" font-weight="600" fill="#0f6cbd">Arquivo</text>
      <text x="78" y="54">Página Inicial</text>
      <text x="164" y="54">Inserir</text>
      <text x="212" y="54">Modelagem</text>
      <text x="292" y="54">Exibição</text>
      <text x="356" y="54">Otimizar</text>
      <text x="416" y="54">Ajuda</text>
    </g>
    <rect x="0" y="63" width="820" height="1" fill="#e1dfdd"/>

    <rect x="12" y="76" width="470" height="350" rx="6" fill="#ffffff" stroke="#e1dfdd"/>
    <text x="30" y="102" font-size="13" font-weight="700" fill="#201f1e">Performance Comercial LATAM</text>

    <g>
      <rect x="30" y="116" width="126" height="64" rx="6" fill="#f8f8f8" stroke="#edebe9"/>
