<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" role="img" aria-label="Comparação entre trabalho sem Git e trabalho com Git">
  <rect width="880" height="430" rx="14" fill="#f8fafc"/>
  <g font-family="Segoe UI, Inter, sans-serif">
    <rect x="18" y="18" width="412" height="394" rx="12" fill="#fff1f2" stroke="#fecdd3"/>
    <text x="224" y="48" text-anchor="middle" font-size="17" font-weight="700" fill="#9f1239">SEM GIT &#8212; arquivos por e-mail</text>

    <g>
      <rect x="44" y="70" width="150" height="40" rx="8" fill="#fff" stroke="#fda4af"/>
      <text x="119" y="95" text-anchor="middle" font-size="12" fill="#7f1d1d">Vendas_v1.pbix</text>
      <rect x="254" y="70" width="150" height="40" rx="8" fill="#fff" stroke="#fda4af"/>
      <text x="329" y="95" text-anchor="middle" font-size="11" fill="#7f1d1d">Vendas_v2_FINAL.pbix</text>
      <rect x="44" y="122" width="150" height="40" rx="8" fill="#fff" stroke="#fda4af"/>
      <text x="119" y="147" text-anchor="middle" font-size="11.5" fill="#7f1d1d">Vendas_final_ok.pbix</text>
      <rect x="254" y="122" width="150" height="40" rx="8" fill="#fff" stroke="#fda4af"/>
      <text x="329" y="141" text-anchor="middle" font-size="11" fill="#7f1d1d">Vendas_FINAL_v3</text>
      <text x="329" y="155" text-anchor="middle" font-size="11" fill="#7f1d1d">_agora_vai.pbix</text>
    </g>

    <g stroke="#e11d48" stroke-width="2" fill="none">
      <path d="M119 174 v20 M329 174 v20"/>
    </g>
    <rect x="80" y="198" width="288" height="48" rx="10" fill="#ffe4e6" stroke="#fb7185"/>
    <text x="224" y="220" text-anchor="middle" font-size="13" font-weight="600" fill="#9f1239">Qual é a versão correta?</text>
    <text x="224" y="238" text-anchor="middle" font-size="11.5" fill="#be123c">Alterações do colega foram sobrescritas</text>

    <g font-size="12.5" fill="#7f1d1d">
      <text x="48" y="278">&#10007;&#160; Sem histórico de quem mudou o quê</text>
      <text x="48" y="302">&#10007;&#160; Sem como voltar atrás</text>
      <text x="48" y="326">&#10007;&#160; Trabalho duplicado e retrabalho</text>
      <text x="48" y="350">&#10007;&#160; Caixa de e-mail como "servidor"</text>
      <text x="48" y="374">&#10007;&#160; Sem revisão antes da publicação</text>
      <text x="48" y="398">&#10007;&#160; Risco de perder o arquivo</text>
    </g>

    <rect x="450" y="18" width="412" height="394" rx="12" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="656" y="48" text-anchor="middle" font-size="17" font-weight="700" fill="#166534">COM GIT &#8212; um repositório único</text>

    <g>
      <path d="M492 190 H820" stroke="#86efac" stroke-width="8" stroke-linecap="round"/>
      <path d="M560 190 C 590 140 630 140 660 140 H760" stroke="#7dd3fc" stroke-width="6" fill="none" stroke-linecap="round"/>
      <path d="M760 140 C 790 140 796 170 820 190" stroke="#7dd3fc" stroke-width="6" fill="none"/>
      <g fill="#16a34a" stroke="#fff" stroke-width="3">
        <circle cx="500" cy="190" r="10"/><circle cx="560" cy="190" r="10"/><circle cx="820" cy="190" r="10"/>
      </g>
      <g fill="#0284c7" stroke="#fff" stroke-width="3">
        <circle cx="660" cy="140" r="10"/><circle cx="710" cy="140" r="10"/><circle cx="760" cy="140" r="10"/>
      </g>
      <text x="500" y="222" text-anchor="middle" font-size="11" fill="#166534">init</text>
      <text x="560" y="222" text-anchor="middle" font-size="11" fill="#166534">main</text>
      <text x="820" y="222" text-anchor="middle" font-size="11" fill="#166534">merge</text>
      <text x="710" y="122" text-anchor="middle" font-size="11" fill="#075985">feature/novo-kpi</text>
    </g>

    <rect x="512" y="70" width="288" height="48" rx="10" fill="#dcfce7" stroke="#4ade80"/>
    <text x="656" y="92" text-anchor="middle" font-size="13" font-weight="600" fill="#166534">Uma única fonte da verdade</text>
    <text x="656" y="110" text-anchor="middle" font-size="11" fill="#15803d">Histórico completo, autor e data de cada mudança</text>

    <g font-size="12.5" fill="#14532d">
      <text x="480" y="278">&#10003;&#160; Histórico com autor, data e motivo</text>
      <text x="480" y="302">&#10003;&#160; Voltar a qualquer versão anterior</text>
      <text x="480" y="326">&#10003;&#160; Trabalho paralelo em branches</text>
      <text x="480" y="350">&#10003;&#160; Revisão por Pull Request</text>
      <text x="480" y="374">&#10003;&#160; Backup automático na nuvem</text>
      <text x="480" y="398">&#10003;&#160; Conflitos detectados e resolvidos</text>
    </g>
  </g>
</svg>
