      <text x="20" y="138" fill="#858585">18</text>
      <text x="20" y="160" fill="#858585">19</text><text x="76" y="160" fill="#569cd6">measure</text><text x="140" y="160" fill="#ce9178"> 'Receita'</text><text x="220" y="160" fill="#d4d4d4"> = SUM( Vendas[Valor] )</text>
