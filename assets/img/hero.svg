      <circle cx="418" cy="222" r="8"/><circle cx="418" cy="176" r="8"/><circle cx="454" cy="176" r="8"/>
    </g>
    <text x="436" y="252" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">Git</text>
    <text x="436" y="300" text-anchor="middle" font-size="12" fill="#64748b">commit / branch</text>

    <!-- GitHub -->
    <g filter="url(#hsh)"><rect x="521" y="150" width="116" height="120" rx="14" fill="#ffffff"/></g>
    <rect x="521" y="150" width="116" height="120" rx="14" fill="none" stroke="#e2e8f0"/>
    <path transform="translate(555 168) scale(0.105)" fill="#24292f" d="M256 0C114.6 0 0 114.6 0 256c0 113.1 73.4 209 175.2 242.9 12.8 2.4 17.5-5.6 17.5-12.3 0-6.1-.2-26.2-.3-47.5-71.3 15.5-86.3-30.2-86.3-30.2-11.7-29.8-28.5-37.7-28.5-37.7-23.3-15.9 1.8-15.6 1.8-15.6 25.7 1.8 39.3 26.4 39.3 26.4 22.9 39.2 60 27.9 74.6 21.3 2.3-16.6 9-28.1 16.3-34.5-57-6.5-116.9-28.5-116.9-126.7 0-28 10-50.9 26.4-68.8-2.7-6.5-11.4-32.6 2.5-67.9 0 0 21.5-6.9 70.4 26.3 20.4-5.7 42.3-8.5 64.1-8.6 21.8.1 43.7 2.9 64.1 8.6 48.8-33.2 70.3-26.3 70.3-26.3 14 35.3 5.2 61.4 2.5 67.9 16.4 17.9 26.3 40.8 26.3 68.8 0 98.4-60 120-117.2 126.4 9.2 7.9 17.4 23.5 17.4 47.4 0 34.2-.3 61.8-.3 70.2 0 6.8 4.6 14.8 17.6 12.3C438.7 465 512 369.1 512 256 512 114.6 397.4 0 256 0z"/>
    <text x="579" y="252" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">GitHub</text>
    <text x="579" y="300" text-anchor="middle" font-size="12" fill="#64748b">push / Pull Request</text>

    <!-- Equipe -->
    <g filter="url(#hsh)"><rect x="664" y="150" width="116" height="120" rx="14" fill="#ffffff"/></g>
    <rect x="664" y="150" width="116" height="120" rx="14" fill="none" stroke="#e2e8f0"/>
    <g fill="#2563eb">
      <circle cx="706" cy="184" r="11"/><path d="M688 214a18 18 0 0 1 36 0z"/>
      <circle cx="740" cy="184" r="11" fill="#7c3aed"/><path d="M722 214a18 18 0 0 1 36 0z" fill="#7c3aed"/>
    </g>
    <text x="722" y="252" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">Equipe</text>
    <text x="722" y="300" text-anchor="middle" font-size="12" fill="#64748b">review e merge</text>

    <g fill="#94a3b8">
      <path d="M214 210 l-10 -6 v12z"/><path d="M357 210 l-10 -6 v12z"/>
      <path d="M500 210 l-10 -6 v12z"/><path d="M643 210 l-10 -6 v12z"/>
    </g>
  </g>
