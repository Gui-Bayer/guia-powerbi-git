      <g fill="#a19f9d">
        <rect x="42" y="374" width="414" height="8" rx="2" opacity=".5"/>
        <rect x="42" y="388" width="380" height="8" rx="2" opacity=".35"/>
        <rect x="42" y="402" width="400" height="8" rx="2" opacity=".35"/>
      </g>
