<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" role="img" aria-label="Fluxo Power BI, VS Code, Git e GitHub">
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eff6ff"/><stop offset="1" stop-color="#f5f3ff"/>
    </linearGradient>
    <linearGradient id="hline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F2C811"/><stop offset="0.35" stop-color="#007ACC"/>
      <stop offset="0.7" stop-color="#F05032"/><stop offset="1" stop-color="#6e5494"/>
    </linearGradient>
    <filter id="hsh" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="880" height="380" rx="18" fill="url(#hbg)"/>
  <g font-family="Segoe UI, Inter, sans-serif">
    <text x="440" y="54" text-anchor="middle" font-size="25" font-weight="700" fill="#0f172a">Power BI + Git + GitHub + VS Code</text>
    <text x="440" y="82" text-anchor="middle" font-size="15" fill="#475569">Um fluxo único, versionado e colaborativo para projetos PBIP</text>

    <path d="M150 210 H730" stroke="url(#hline)" stroke-width="6" stroke-linecap="round"/>

    <!-- Power BI -->
    <g filter="url(#hsh)">
      <rect x="92" y="150" width="116" height="120" rx="14" fill="#ffffff"/>
    </g>
    <rect x="92" y="150" width="116" height="120" rx="14" fill="none" stroke="#e2e8f0"/>
    <g transform="translate(126 172)">
      <rect x="0" y="26" width="13" height="26" rx="3" fill="#F2C811"/>
      <rect x="19" y="14" width="13" height="38" rx="3" fill="#E8B000"/>
      <rect x="38" y="2" width="13" height="50" rx="3" fill="#D99B00"/>
    </g>
    <text x="150" y="252" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">Power BI</text>
    <text x="150" y="300" text-anchor="middle" font-size="12" fill="#64748b">Salvar como .pbip</text>

    <!-- VS Code -->
    <g filter="url(#hsh)"><rect x="235" y="150" width="116" height="120" rx="14" fill="#ffffff"/></g>
    <rect x="235" y="150" width="116" height="120" rx="14" fill="none" stroke="#e2e8f0"/>
    <path d="M293 170 l26 -12 v66 l-26 -12 -20 18 -8 -6 18 -18 -18 -18 8 -6z" fill="#007ACC"/>
    <text x="293" y="252" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">VS Code</text>
    <text x="293" y="300" text-anchor="middle" font-size="12" fill="#64748b">Editar e revisar</text>

    <!-- Git -->
    <g filter="url(#hsh)"><rect x="378" y="150" width="116" height="120" rx="14" fill="#ffffff"/></g>
    <rect x="378" y="150" width="116" height="120" rx="14" fill="none" stroke="#e2e8f0"/>
    <g stroke="#F05032" stroke-width="4" fill="#F05032">
