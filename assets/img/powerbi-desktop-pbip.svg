      <text x="42" y="162" font-size="19" font-weight="700" fill="#107c10">R$ 18,4M</text>

      <rect x="164" y="116" width="126" height="64" rx="6" fill="#f8f8f8" stroke="#edebe9"/>
      <text x="176" y="136" font-size="9.5" fill="#605e5c">KPI LATAM</text>
      <text x="176" y="162" font-size="19" font-weight="700" fill="#0f6cbd">104,2%</text>

      <rect x="298" y="116" width="170" height="64" rx="6" fill="#f8f8f8" stroke="#edebe9"/>
      <text x="310" y="136" font-size="9.5" fill="#605e5c">MARGEM</text>
      <text x="310" y="162" font-size="19" font-weight="700" fill="#8764b8">32,7%</text>

      <rect x="30" y="192" width="260" height="140" rx="6" fill="#f8f8f8" stroke="#edebe9"/>
      <text x="42" y="212" font-size="10" fill="#605e5c">Receita por mês</text>
      <g fill="#0f6cbd">
        <rect x="46" y="284" width="18" height="34" rx="2"/><rect x="74" y="266" width="18" height="52" rx="2"/>
        <rect x="102" y="248" width="18" height="70" rx="2"/><rect x="130" y="256" width="18" height="62" rx="2"/>
        <rect x="158" y="230" width="18" height="88" rx="2"/><rect x="186" y="240" width="18" height="78" rx="2"/>
        <rect x="214" y="218" width="18" height="100" rx="2"/><rect x="242" y="226" width="18" height="92" rx="2"/>
      </g>

      <rect x="298" y="192" width="170" height="140" rx="6" fill="#f8f8f8" stroke="#edebe9"/>
      <text x="310" y="212" font-size="10" fill="#605e5c">Mix por país</text>
      <circle cx="383" cy="268" r="44" fill="#0f6cbd"/>
      <path d="M383 268 L383 224 A44 44 0 0 1 424 283 Z" fill="#8764b8"/>
      <path d="M383 268 L424 283 A44 44 0 0 1 396 310 Z" fill="#F2C811"/>
      <circle cx="383" cy="268" r="18" fill="#f8f8f8"/>

      <rect x="30" y="344" width="438" height="70" rx="6" fill="#f8f8f8" stroke="#edebe9"/>
