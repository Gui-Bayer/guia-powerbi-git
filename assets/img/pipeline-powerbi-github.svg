    <text x="156" y="94" font-size="14" font-weight="700" fill="#713f12">1. Power BI Desktop</text>
    <text x="156" y="116" font-size="12" fill="#854d0e">Salvar como projeto (.pbip) &#8594; gera pasta de texto</text>

