<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" role="img" aria-label="Estrutura de pastas de um projeto PBIP no explorador do VS Code">
  <rect width="820" height="420" rx="12" fill="#1e1e1e"/>
  <rect x="0" y="0" width="820" height="30" rx="12" fill="#3c3c3c"/>
  <rect x="0" y="18" width="820" height="12" fill="#3c3c3c"/>
  <g font-family="Segoe UI, Inter, sans-serif">
    <text x="16" y="20" font-size="11.5" fill="#cccccc">Vendas-LATAM &#8212; Visual Studio Code</text>

    <rect x="0" y="30" width="420" height="390" fill="#252526"/>
    <text x="18" y="52" font-size="11" letter-spacing="1" fill="#cccccc">EXPLORER</text>
    <text x="18" y="76" font-size="11.5" font-weight="700" fill="#e7e7e7">&#9662; VENDAS-LATAM</text>

    <g font-family="Consolas, monospace" font-size="12">
      <path d="M34 84 V350" stroke="#3c3c3c"/>
      <g fill="#cccccc">
        <text x="42" y="104"><tspan fill="#e2c08d">&#9656;</tspan> <tspan fill="#e7e7e7">.vscode</tspan></text>
        <text x="42" y="126"><tspan fill="#42a5f5">&#9656;</tspan> <tspan fill="#e7e7e7">Vendas.Report</tspan></text>
        <text x="66" y="148"><tspan fill="#42a5f5">&#9656;</tspan> definition</text>
        <text x="90" y="170"><tspan fill="#f9d36b">{}</tspan> report.json</text>
        <text x="90" y="192"><tspan fill="#f9d36b">{}</tspan> pages/pages.json</text>
        <text x="66" y="214"><tspan fill="#f9d36b">{}</tspan> .platform</text>

        <text x="42" y="238"><tspan fill="#b180d7">&#9656;</tspan> <tspan fill="#e7e7e7">Vendas.SemanticModel</tspan></text>
        <text x="66" y="260"><tspan fill="#b180d7">&#9656;</tspan> definition</text>
        <text x="90" y="282"><tspan fill="#4ec9b0">&#9672;</tspan> model.tmdl</text>
        <text x="90" y="304"><tspan fill="#4ec9b0">&#9672;</tspan> tables/Vendas.tmdl</text>
        <text x="90" y="326"><tspan fill="#4ec9b0">&#9672;</tspan> tables/Calendario.tmdl</text>
        <text x="66" y="348"><tspan fill="#f9d36b">{}</tspan> diagramLayout.json</text>

        <text x="42" y="372"><tspan fill="#F05032">&#9679;</tspan> <tspan fill="#e7e7e7">.gitignore</tspan></text>
        <text x="42" y="394"><tspan fill="#519aba">&#9634;</tspan> <tspan fill="#e7e7e7">README.md</tspan></text>
        <text x="42" y="416"><tspan fill="#F2C811">&#9635;</tspan> <tspan fill="#e7e7e7">Vendas.pbip</tspan></text>
      </g>
    </g>

    <rect x="420" y="30" width="400" height="390" fill="#1e1e1e"/>
    <text x="444" y="60" font-size="13.5" font-weight="700" fill="#ffffff">O que é cada parte</text>

    <rect x="444" y="76" width="352" height="58" rx="6" fill="#252526" stroke="#3c3c3c"/>
    <text x="458" y="96" font-size="11.5" font-weight="600" fill="#F2C811">Vendas.pbip</text>
    <text x="458" y="114" font-size="10.5" fill="#cccccc">Arquivo "ponteiro". É o que você abre</text>
    <text x="458" y="128" font-size="10.5" fill="#cccccc">no Power BI Desktop.</text>

    <rect x="444" y="144" width="352" height="58" rx="6" fill="#252526" stroke="#3c3c3c"/>
    <text x="458" y="164" font-size="11.5" font-weight="600" fill="#42a5f5">*.Report/</text>
    <text x="458" y="182" font-size="10.5" fill="#cccccc">Visuais, páginas, layout e formatação,</text>
    <text x="458" y="196" font-size="10.5" fill="#cccccc">em JSON legível.</text>

    <rect x="444" y="212" width="352" height="58" rx="6" fill="#252526" stroke="#3c3c3c"/>
    <text x="458" y="232" font-size="11.5" font-weight="600" fill="#b180d7">*.SemanticModel/</text>
    <text x="458" y="250" font-size="10.5" fill="#cccccc">Tabelas, relacionamentos, colunas e</text>
    <text x="458" y="264" font-size="10.5" fill="#cccccc">medidas DAX em arquivos .tmdl.</text>

    <rect x="444" y="280" width="352" height="58" rx="6" fill="#252526" stroke="#3c3c3c"/>
    <text x="458" y="300" font-size="11.5" font-weight="600" fill="#F05032">.gitignore</text>
    <text x="458" y="318" font-size="10.5" fill="#cccccc">Lista o que o Git deve ignorar</text>
    <text x="458" y="332" font-size="10.5" fill="#cccccc">(cache, .pbix local, credenciais).</text>

    <rect x="444" y="348" width="352" height="52" rx="6" fill="#0b3a53" stroke="#0e639c"/>
    <text x="458" y="368" font-size="11" font-weight="600" fill="#79c0ff">Regra de ouro</text>
    <text x="458" y="386" font-size="10.5" fill="#c9e7ff">Versione a PASTA inteira do projeto.</text>
  </g>
</svg>
