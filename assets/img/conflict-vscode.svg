    <rect x="0" y="412" width="820" height="28" fill="#a1260d"/>
    <text x="16" y="431" font-size="10.5" fill="#ffffff">&#9410; feature/novo-kpi!+&#160; |&#160; Resolva os 3 marcadores, salve o arquivo e rode: git add . &amp;&amp; git commit</text>
